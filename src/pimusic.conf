[music]
# Full path to the folder containing your music files and playlists.
# This folder must be accessible on the Pi when the service runs.
root = /mnt/mymusicfolder

[server]
host = 0.0.0.0
port = 5054
# Set to true during development to also print log output to the console
log_console = true

[player]
# Audio backend: mpg123 (MP3 only) or mplayer (MP3, OGG, FLAC, AAC, ...)
# Make sure the chosen player is installed: sudo apt install mpg123 / mplayer
backend = mpg123
#backend = mplayer
