<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiMusic</title>
  <link rel="icon" type="image/x-icon"  href="/static/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/site.webmanifest">
  <link rel="stylesheet" href="/static/style.css?v={{ static_ver('style.css') }}">
</head>
<body>

<header>
  <img class="header-icon" src="/static/icon-512.png" alt="">
  <span class="backend-label">{{ backend }}</span>
  <span class="logo">Pi Music</span>
  <span id="state-badge" class="badge stopped">stopped</span>
</header>

<section id="player">
  <div id="now-playing">
    <span id="track-name">Nothing playing</span>
    <span id="track-pos"></span>
  </div>
  <button id="btn-reveal" title="Show the playing track in the list"
          aria-label="Show the playing track in the list"
          onclick="revealTrack()" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="12" r="2.3" fill="currentColor"/>
      <path d="M12 1v3.4M12 19.6V23M1 12h3.4M19.6 12H23"
            stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <div id="controls">
    <button id="btn-prev"      title="Previous track" onclick="cmdPrev()"      disabled>&#9664;&#9664;</button>
    <button id="btn-playpause" title="Play"            onclick="cmdPlayPause()" disabled>&#9654; Play</button>
    <button id="btn-stop"      title="Stop"            onclick="cmdStop()"      disabled>&#9632;</button>
    <button id="btn-next"      title="Next track"      onclick="cmdNext()"      disabled>&#9654;&#9654;</button>
    <button id="btn-shuffle"   title="Shuffle"         onclick="cmdShuffle()"          >&#8652;</button>
  </div>
</section>

<section id="browser">
  <div id="breadcrumb"></div>
  <ul id="file-list"></ul>
</section>

<footer id="progressbar" hidden>
  <span id="prog-current">0:00</span>
  <div id="prog-hit"><div id="prog-track"><div id="prog-fill"></div></div></div>
  <span id="prog-total">0:00</span>
</footer>

<script src="/static/app.js?v={{ static_ver('app.js') }}"></script>
</body>
</html>
